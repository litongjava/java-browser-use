# 发行包里内嵌的 Chromium 构建号(Playwright 的浏览器修订号)。
#
# scripts/package/build-release.mjs 用它拼下载地址:
#   https://cdn.playwright.dev/dbazure/download/playwright/builds/chromium/<revision>/chromium-<平台>.zip
# BundledBrowserRevisionTest 会校验它与当前 Playwright 版本要求的修订号一致,
# 所以升级 Playwright 依赖后如果这个值没跟着改,构建会直接失败。
chromium.revision=1179
